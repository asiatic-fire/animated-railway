<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>It's live.</title>
<meta name="theme-color" content="#0B0D1A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B0D1A;
    --bone: #EDEBFF;
    --violet: #7C5CFF;
    --mint: #3DF5C0;
    --muted: #8E8BB0;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--ink); color: var(--bone); overflow: hidden; }
  body { font-family: "Bricolage Grotesque", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  main {
    position: relative; z-index: 1; height: 100%;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: clamp(24px, 6vw, 72px);
    pointer-events: none;
  }
  h1 {
    font-weight: 800; line-height: .88; letter-spacing: -0.04em;
    font-size: clamp(64px, 17vw, 240px);
    font-variation-settings: "opsz" 96;
  }
  h1 span { display: inline-block; opacity: 0; transform: translateY(40%); animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
  h1 span:nth-child(1) { animation-delay: .1s; }
  h1 span:nth-child(2) { animation-delay: .22s; }
  h1 span:nth-child(3) { animation-delay: .34s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  p.sub { margin-top: 20px; max-width: 34ch; font-weight: 300; font-size: clamp(16px, 2vw, 22px); color: var(--muted); }

  .chip {
    position: fixed; top: clamp(16px, 3vw, 32px); right: clamp(16px, 3vw, 32px); z-index: 2;
    font: 400 13px/1 "JetBrains Mono", ui-monospace, monospace;
    padding: 10px 14px; border: 1px solid rgba(237,235,255,.18); border-radius: 999px;
    background: rgba(11,13,26,.6); backdrop-filter: blur(8px);
    display: flex; gap: 10px; align-items: center;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .chip.ok .dot { background: var(--mint); box-shadow: 0 0 0 0 rgba(61,245,192,.6); animation: ping 1.8s infinite; }
  @keyframes ping { to { box-shadow: 0 0 0 10px rgba(61,245,192,0); } }

  @media (prefers-reduced-motion: reduce) {
    h1 span { animation: none; opacity: 1; transform: none; }
    .chip.ok .dot { animation: none; }
  }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="chip" id="chip"><i class="dot"></i><span id="status">connecting…</span></div>
<main>
  <h1 aria-label="It's live."><span>It's</span> <span>live.</span></h1>
  <p class="sub">Served from Railway. Move your pointer and the field follows.</p>
</main>

<script>
(() => {
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, dpr, particles = [];
  const mouse = { x: -9999, y: -9999, active: false };
  const COUNT = () => Math.min(1400, Math.floor((w * h) / 1400));

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#0B0D1A"; ctx.fillRect(0, 0, w, h);
    particles = Array.from({ length: COUNT() }, spawn);
  }
  function spawn() {
    return { x: Math.random() * w, y: Math.random() * h, life: Math.random() * 200 };
  }

  // cheap smooth pseudo-noise
  const field = (x, y, t) =>
    Math.sin(x * .0042 + t * .0004) * Math.cos(y * .0051 - t * .0003) * Math.PI * 2 +
    Math.sin((x + y) * .0021 + t * .0002) * 1.4;

  function frame(t) {
    ctx.fillStyle = "rgba(11,13,26,.07)";
    ctx.fillRect(0, 0, w, h);
    ctx.lineWidth = 1.1;

    for (const p of particles) {
      let a = field(p.x, p.y, t);
      if (mouse.active) {
        const dx = mouse.x - p.x, dy = mouse.y - p.y, d = Math.hypot(dx, dy);
        if (d < 260) {
          const pull = (1 - d / 260);
          a = a * (1 - pull) + Math.atan2(dy, dx) * pull;
        }
      }
      const nx = p.x + Math.cos(a) * 1.6;
      const ny = p.y + Math.sin(a) * 1.6;

      const near = mouse.active && Math.hypot(mouse.x - p.x, mouse.y - p.y) < 160;
      ctx.strokeStyle = near ? "rgba(61,245,192,.75)" : "rgba(124,92,255,.5)";
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(nx, ny); ctx.stroke();

      p.x = nx; p.y = ny; p.life++;
      if (p.life > 260 || p.x < 0 || p.x > w || p.y < 0 || p.y > h) Object.assign(p, spawn(), { life: 0 });
    }
    if (!reduce) requestAnimationFrame(frame);
  }

  addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
  addEventListener("pointerleave", () => { mouse.active = false; });
  addEventListener("resize", resize);
  resize();
  if (reduce) { for (let i = 0; i < 160; i++) frame(i * 16); } else requestAnimationFrame(frame);

  // live status from the server
  const chip = document.getElementById("chip"), status = document.getElementById("status");
  async function ping() {
    try {
      const r = await fetch("/health", { cache: "no-store" });
      const j = await r.json();
      chip.classList.add("ok");
      status.textContent = `${j.status} · ${j.region} · ${j.commit} · up ${j.uptimeSeconds}s`;
    } catch {
      chip.classList.remove("ok");
      status.textContent = "offline";
    }
  }
  ping(); setInterval(ping, 5000);
})();
</script>
</body>
</html>
